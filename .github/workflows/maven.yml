# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: UI Test Automation Workflow

on:
  schedule:
    - cron: 00 18 * * *
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Running Test Automation Framework with maven
      run: mvn test -X -Dbrowser=chrome -DisLambdaTest=false -DisHeadless=true
      
    - name: Upload Test Logs 
      if: always()
      uses: actions/upload-artifact@v7.0.0
      with:
        name: Test Logs
        path: logs/

    - name: Upload Screenshots as artifacts
      if: always()
      uses: actions/upload-artifact@v7.0.0
      with:
        name: screenshots
        path: screenshots/

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v7.0.0
      with:
        name: Test Reports
        path: report.html

    - name: Test Execution status 
      if: always()
      run: echo "Test Execution completed"

    - name: Copy Reports to gh-pages Folder
      if: always()

      run: |
        mkdir -p public/extent-reports
        cp -R report.html  public/extent-reports/
        cp -R screenshots/  public/extent-reports/screenshots/

    - name: Deploy to Github Pages
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4.8.0
      with:
        folder: public/extent-reports
        token: ${{ secrets.PAT_GITHUB_PAGES }}
        clean: true
    

    
    




      
